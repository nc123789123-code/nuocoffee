<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ABC Co. — Coffee with Onlu</title>
<meta name="description" content="ABC Co. supports Coffee with Onlu." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a1520" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232ee0d0%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M5%209h11v4a4%204%200%200%201-4%204H9a4%204%200%200%201-4-4V9Z%22%2F%3E%3Cpath%20d%3D%22M16%2010h2.4a2.4%202.4%200%200%201%200%204.8H16%22%2F%3E%3Cpath%20d%3D%22M8%203.4c-.5%201%20.5%201.6%200%202.6M11.5%203.4c-.5%201%20.5%201.6%200%202.6%22%2F%3E%3C%2Fsvg%3E" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{
  --bg:#0a1520; --surface:rgba(255,255,255,.035);
  --text:#eef6fb; --muted:#93aec4; --dim:#6d8aa3; --line:rgba(150,200,230,.14);
  --tiffany:#2ee0d0; --tiffany2:#9befe4; --sky:#4cc4ff; --pink:#ff4f9a;
  --display:'Unbounded',system-ui,sans-serif;
  --body:'Outfit',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'Space Mono',ui-monospace,'Courier New',monospace;
  --grad:linear-gradient(100deg,var(--tiffany2),var(--tiffany) 30%,var(--sky) 58%,var(--pink) 92%);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding-bottom:50px;overflow-x:hidden;}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(90px);}
.b1{width:85vw;height:85vw;top:-30vh;right:-32vw;background:radial-gradient(circle,var(--tiffany),transparent 68%);opacity:.22;}
.b2{width:75vw;height:75vw;bottom:-16vh;left:-30vw;background:radial-gradient(circle,var(--pink),transparent 68%);opacity:.13;}
.wrap{position:relative;z-index:1;max-width:620px;margin-inline:auto;padding:0 20px;}

/* the strip that says whose site you are on */
.top{border-bottom:1px solid var(--line);background:rgba(6,14,22,.6);}
.top__in{max-width:620px;margin-inline:auto;padding:13px 20px;display:flex;align-items:center;gap:10px;}
.cup{color:var(--tiffany2);line-height:0;flex:none;}
.cup svg{width:21px;height:21px;display:block;}
.top__n{font-family:var(--display);font-weight:600;font-size:.88rem;letter-spacing:-.01em;}
.top .lang{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:.66rem;letter-spacing:.1em;
  color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 11px;cursor:pointer;white-space:nowrap;}

.hero{padding:46px 0 0;}
.kicker{font-family:var(--mono);text-transform:uppercase;letter-spacing:.2em;font-size:.68rem;
  font-weight:700;color:var(--tiffany2);}
.mark{width:84px;height:84px;border-radius:21px;display:grid;place-items:center;margin:20px 0 20px;
  background:var(--grad);color:#08131c;font-family:var(--display);font-weight:800;font-size:1.5rem;
  letter-spacing:-.02em;box-shadow:0 0 50px -12px rgba(46,224,208,.6);}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.08;
  font-size:clamp(2rem,9vw,2.9rem);}
.tagline{font-family:var(--mono);font-size:.76rem;letter-spacing:.1em;color:var(--dim);
  text-transform:uppercase;margin-top:11px;}
.body{font-size:1rem;color:var(--muted);line-height:1.65;margin-top:22px;}
.body + .body{margin-top:13px;}
.btn{display:inline-block;margin-top:24px;font-family:var(--mono);font-weight:700;font-size:.74rem;
  letter-spacing:.12em;text-transform:uppercase;color:#08131c;background:var(--grad);
  padding:14px 24px;border-radius:999px;text-decoration:none;
  box-shadow:0 0 40px -12px rgba(255,79,154,.6);}

h2{font-family:var(--display);font-weight:600;letter-spacing:-.015em;font-size:1.05rem;
  margin:48px 0 14px;}
.ev{display:flex;align-items:baseline;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);}
.ev:first-of-type{border-top:1px solid var(--line);}
.ev__d{font-family:var(--mono);font-size:.7rem;color:var(--dim);letter-spacing:.04em;flex:none;width:76px;}
.ev__n{font-size:.95rem;line-height:1.4;}
.ev__p{font-size:.78rem;color:var(--dim);margin-top:2px;}

.back{display:flex;align-items:center;gap:12px;margin-top:42px;padding:16px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;}
.back__t{font-size:.92rem;font-weight:600;}
.back__s{font-size:.82rem;color:var(--muted);margin-top:2px;}
.back__a{margin-left:auto;color:var(--tiffany2);flex:none;}

.foot{margin:34px 0 0;padding-top:18px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:.68rem;color:var(--dim);line-height:1.8;}
.foot a{color:var(--tiffany2);}
</style>
</head>
<body>
<div class="fx"><span class="blob b1"></span><span class="blob b2"></span></div>

<div class="top"><div class="top__in">
  <span class="cup" id="cup"></span>
  <span class="top__n">Coffee with Onlu</span>
  <button class="lang" id="lang" type="button">EN</button>
</div></div>

<div class="wrap">
  <section class="hero">
    <p class="kicker" id="kicker"></p>
    <div class="mark">ABC</div>
    <h1>ABC Co.</h1>
    <p class="tagline" id="tagline"></p>
    <p class="body" id="p1"></p>
    <p class="body" id="p2"></p>
    <a class="btn" href="#" id="btn"></a>
  </section>

  <h2 id="h2"></h2>
  <div id="events"></div>

  <a class="back" href="/sponsor/">
    <div>
      <div class="back__t" id="back-t"></div>
      <div class="back__s" id="back-s"></div>
    </div>
    <span class="back__a">→</span>
  </a>

  <p class="foot">
    <a href="/">coffeewithonlu.com</a> · An Onlu Intel project<br>
    <span id="disc"></span>
  </p>
</div>

<script>
(function(){
  "use strict";
  document.getElementById("cup").innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" ' +
    'stroke-linejoin="round"><path d="M5 9h11v4a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9Z"/>' +
    '<path d="M16 10h2.4a2.4 2.4 0 0 1 0 4.8H16"/>' +
    '<path d="M8 3.4c-.5 1 .5 1.6 0 2.6M11.5 3.4c-.5 1 .5 1.6 0 2.6"/></svg>';

  var T = {
    kicker: { zh:"Coffee with Onlu 支持方", en:"Supporting Coffee with Onlu" },
    tagline:{ zh:"New York", en:"New York" },
    p1: { zh:"ABC Co. 是一家总部位于纽约的公司，长期关注金融行业与在美华人专业人士社群。",
          en:"ABC Co. is a New York company with a long-standing focus on the finance industry and the Chinese professional community in the US." },
    p2: { zh:"我们支持 Coffee with Onlu，希望与纽约的金融从业者建立长期联系。",
          en:"We support Coffee with Onlu to build lasting relationships with finance professionals in New York." },
    btn: { zh:"访问 ABC Co. →", en:"Visit ABC Co. →" },
    h2:  { zh:"支持过的场次", en:"Sessions supported" },
    backT:{ zh:"想成为支持方？", en:"Interested in sponsoring?" },
    backS:{ zh:"查看方案与价格", en:"See the tiers and pricing" },
    disc:{ zh:"ABC Co. 为虚构品牌，此页用于展示赞助方页面的实际样式。",
           en:"ABC Co. is a fictional brand; this page shows the actual format of a sponsor page." }
  };

  var EVENTS = [
    { d:{ zh:"10 月 17 日", en:"Oct 17" }, n:{ zh:"Finance × AI 创业 brainstorm", en:"Finance × AI startup brainstorm" },
      p:{ zh:"即将举行", en:"Upcoming" } },
    { d:{ zh:"10 月 11 日", en:"Oct 11" }, n:{ zh:"AI 数据中心融资", en:"AI data center financing" },
      p:{ zh:"14 人 · Midtown", en:"14 people · Midtown" } },
    { d:{ zh:"10 月 3 日",  en:"Oct 3" },  n:{ zh:"信贷 coffee chat", en:"Credit coffee chat" },
      p:{ zh:"14 人", en:"14 people" } },
    { d:{ zh:"8 月 30 日",  en:"Aug 30" }, n:{ zh:"AI × 金融", en:"AI and finance" },
      p:{ zh:"13 人 · Midtown", en:"13 people · Midtown" } }
  ];

  var lang = "zh";
  try { if (localStorage.getItem("onlu-sponsor-lang") === "en") lang = "en"; } catch(e){}
  var q = (location.search.match(/[?&]lang=(en|zh)/) || [])[1];
  if (q) lang = q;   // a shared ?lang= link always wins

  function paint(){
    ["kicker","tagline","p1","p2","btn","h2","disc"].forEach(function(k){
      var id = k === "backT" ? "back-t" : k;
      document.getElementById(id).textContent = T[k][lang];
    });
    document.getElementById("back-t").textContent = T.backT[lang];
    document.getElementById("back-s").textContent = T.backS[lang];
    document.getElementById("events").innerHTML = EVENTS.map(function(e){
      return '<div class="ev"><span class="ev__d">' + e.d[lang] + "</span>" +
             '<span><span class="ev__n">' + e.n[lang] + "</span>" +
             '<div class="ev__p">' + e.p[lang] + "</div></span></div>";
    }).join("");
    document.getElementById("lang").innerHTML = lang === "en" ? '中文 / <b style="color:#eef6fb">EN</b>' : '<b style="color:#eef6fb">中文</b> / EN';
    document.documentElement.lang = lang === "en" ? "en" : "zh";
  }
  document.getElementById("lang").addEventListener("click", function(){
    lang = lang === "en" ? "zh" : "en";
    try { localStorage.setItem("onlu-sponsor-lang", lang); } catch(e){}
    paint();
  });
  paint();
})();
</script>
</body>
</html>
