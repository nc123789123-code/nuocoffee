<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>参与者画像 — Coffee with Onlu</title>
<meta name="description" content="Who comes to Coffee with Onlu: participant profile." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a1520" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232ee0d0%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M5%209h11v4a4%204%200%200%201-4%204H9a4%204%200%200%201-4-4V9Z%22%2F%3E%3Cpath%20d%3D%22M16%2010h2.4a2.4%202.4%200%200%201%200%204.8H16%22%2F%3E%3Cpath%20d%3D%22M8%203.4c-.5%201%20.5%201.6%200%202.6M11.5%203.4c-.5%201%20.5%201.6%200%202.6%22%2F%3E%3C%2Fsvg%3E" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{
  --bg:#0a1520; --text:#eef6fb; --muted:#93aec4; --dim:#6d8aa3; --line:rgba(150,200,230,.16);
  --tiffany:#2ee0d0; --tiffany2:#9befe4; --tiffany3:#0fa89f;
  --sky:#4cc4ff; --azure:#4d84ff; --indigo:#8a9bff; --pink:#ff4f9a;
  --display:'Unbounded',system-ui,sans-serif;
  --body:'Outfit',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'Space Mono',ui-monospace,'Courier New',monospace;
  --grad:linear-gradient(100deg,var(--tiffany2),var(--tiffany) 30%,var(--sky) 58%,var(--pink) 92%);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--body);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden;}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(80px);}
.b1{width:75vw;height:75vw;top:-22vh;right:-28vw;background:radial-gradient(circle,var(--tiffany),transparent 68%);opacity:.34;}
.b2{width:70vw;height:70vw;bottom:-18vh;left:-28vw;background:radial-gradient(circle,var(--pink),transparent 68%);opacity:.22;}

.deck{position:relative;z-index:1;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
  padding:clamp(24px,6vw,72px);padding-top:clamp(64px,10vh,90px);padding-bottom:clamp(70px,12vh,100px);overflow-y:auto;}
.slide.is-active{display:flex;}
.deck,.slide{height:100vh;}
@supports (height:100dvh){ .deck,.slide{height:100dvh;} }
.wrap{width:100%;max-width:820px;margin-inline:auto;}

.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;
  font-size:clamp(.64rem,2.6vw,.78rem);font-weight:700;color:var(--tiffany2);}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.06;text-wrap:balance;}
h1{font-size:clamp(2.2rem,10vw,4.4rem);margin:.3em 0 .35em;}
h2{font-size:clamp(1.45rem,6.6vw,2.6rem);margin:.32em 0 .7em;}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{font-size:clamp(1rem,4.3vw,1.4rem);color:var(--muted);line-height:1.45;max-width:32ch;}
.foot{margin-top:clamp(16px,3.5vw,24px);font-family:var(--mono);font-size:clamp(.66rem,2.7vw,.76rem);
  color:var(--dim);line-height:1.6;}
.mark{margin-top:clamp(26px,6vw,42px);display:flex;align-items:center;gap:11px;}
.cup{color:var(--tiffany2);line-height:0;filter:drop-shadow(0 0 12px rgba(46,224,208,.5));}
.cup svg{width:26px;height:26px;display:block;}
.brand{font-family:var(--display);font-weight:600;font-size:clamp(.95rem,3.6vw,1.05rem);}
.tag{font-family:var(--mono);font-size:clamp(.68rem,2.8vw,.76rem);color:var(--dim);margin-top:3px;}

/* numbers */
.nums{display:grid;grid-template-columns:1fr 1fr;gap:clamp(9px,2.2vw,14px);}
.num{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);
  padding:clamp(12px,3vw,18px);border-left:3px solid var(--ac);}
.num.wide{grid-column:1 / -1;}
.num__n{font-family:var(--display);font-weight:800;letter-spacing:-.02em;color:var(--ac);
  font-size:clamp(1.6rem,7.5vw,2.6rem);line-height:1.05;}
.num__k{font-size:clamp(.82rem,3.4vw,.98rem);color:var(--muted);margin-top:5px;line-height:1.35;}

/* seniority */
.big{font-size:clamp(1.15rem,5vw,1.7rem);line-height:1.45;color:var(--muted);max-width:30ch;}
.big b{color:var(--text);}
.split{display:grid;grid-template-columns:1fr;gap:10px;margin-top:clamp(20px,5vw,30px);}
@media (min-width:640px){ .split{grid-template-columns:1fr 1fr;} }
.side{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);
  padding:clamp(12px,3vw,17px);border-left:3px solid var(--ac);}
.side__k{font-family:var(--mono);font-size:clamp(.62rem,2.6vw,.72rem);font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ac);}
.side__v{font-size:clamp(.88rem,3.6vw,1.02rem);margin-top:6px;line-height:1.45;}

/* field bars */
.bars{display:flex;flex-direction:column;gap:clamp(10px,2.6vw,15px);}
.bar__top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-size:clamp(.88rem,3.7vw,1.04rem);}
.bar__pct{font-family:var(--mono);font-weight:700;color:var(--ac);font-size:clamp(.8rem,3.3vw,.92rem);flex:none;}
.bar__track{height:9px;border-radius:999px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden;}
.bar__fill{height:100%;border-radius:999px;background:var(--ac);box-shadow:0 0 14px var(--ac);}
.bar__eg{font-size:clamp(.74rem,3vw,.84rem);color:var(--dim);margin-top:5px;line-height:1.35;}

/* role chips */
.chips{display:flex;flex-wrap:wrap;gap:clamp(7px,1.8vw,10px);}
.chip{display:inline-flex;align-items:center;gap:8px;padding:clamp(7px,1.8vw,10px) clamp(11px,2.8vw,14px);
  border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);
  font-size:clamp(.8rem,3.3vw,.95rem);line-height:1.2;}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;background:var(--ac);box-shadow:0 0 9px var(--ac);}

/* topics */
.topics{list-style:none;display:flex;flex-direction:column;gap:clamp(9px,2.3vw,13px);}
.topics li{display:flex;align-items:center;gap:13px;padding:clamp(11px,2.8vw,15px) clamp(13px,3.2vw,17px);
  border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.03);border-left:3px solid var(--ac);
  font-size:clamp(.95rem,4vw,1.12rem);}
.topics .n{font-family:var(--mono);font-weight:700;font-size:clamp(.66rem,2.7vw,.76rem);color:var(--ac);flex:none;}
.topics .up{margin-left:auto;font-family:var(--mono);font-size:clamp(.62rem,2.5vw,.7rem);color:var(--pink);
  letter-spacing:.06em;flex:none;}

.cta{display:inline-block;margin-top:clamp(22px,5vw,32px);font-family:var(--mono);font-weight:700;
  font-size:clamp(.72rem,3vw,.82rem);letter-spacing:.12em;text-transform:uppercase;color:#08131c;background:var(--grad);
  padding:15px 24px;border-radius:999px;text-decoration:none;box-shadow:0 0 40px -10px rgba(255,79,154,.6);
  position:relative;z-index:4;}

/* nav */
.nav{position:fixed;top:0;bottom:clamp(70px,12vh,100px);z-index:2;width:32%;border:none;background:transparent;
  cursor:pointer;-webkit-tap-highlight-color:transparent;}
.nav.prev{left:0;} .nav.next{right:0;}
.dots{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  z-index:3;display:flex;gap:6px;justify-content:center;align-items:center;}
.dot{width:28px;height:28px;padding:0;border:none;background:transparent;cursor:pointer;
  display:grid;place-items:center;-webkit-tap-highlight-color:transparent;}
.dot::after{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .2s,transform .2s;}
.dot.on::after{background:var(--tiffany2);transform:scale(1.45);}
.langbtn{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);
  font-family:var(--mono);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--muted);
  background:rgba(10,21,32,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap;}
.langbtn b{color:var(--text);}
</style>
</head>
<body>
<div class="fx"><span class="blob b1"></span><span class="blob b2"></span></div>
<div class="deck" id="deck"></div>
<button class="nav prev" id="prev" aria-label="Previous"></button>
<button class="nav next" id="next" aria-label="Next"></button>
<div class="dots" id="dots"></div>
<button class="langbtn" id="lang" aria-label="Switch language"></button>

<script>
(function(){
  "use strict";
  var CUP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h11v4a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9Z"/><path d="M16 10h2.4a2.4 2.4 0 0 1 0 4.8H16"/><path d="M8 3.4c-.5 1 .5 1.6 0 2.6M11.5 3.4c-.5 1 .5 1.6 0 2.6"/></svg>';

  /* Field mix, counted seat by seat from the four sessions with full rosters
     (Onlu dinner, AI × Finance 8/30, Credit 10/3, Data Center 10/11).
     43 participants; the host is excluded. Shares are of 43. */
  var FIELDS = [
    { c:12, ac:"var(--tiffany)",
      t:{ zh:"信贷", en:"Credit" },
      e:{ zh:"私募信贷、直接借贷、结构化、公开市场信用、信用交易、CDS、银行放贷",
          en:"Private credit, direct lending, structured, public credit, credit trading, CDS, bank lending" } },
    { c:7, ac:"var(--indigo)",
      t:{ zh:"私募股权、实物资产与资管", en:"Private equity, real assets & asset management" },
      e:{ zh:"基建 PE、地产 PE、工业 PE、私募资本承揽、投资管理",
          en:"Infrastructure, real estate and industrial PE; private capital origination; investment management" } },
    { c:6, ac:"var(--pink)",
      t:{ zh:"投行", en:"Investment banking" },
      e:{ zh:"FIG、结构化融资、杠杆融资、重组",
          en:"FIG, structured finance, leveraged finance, restructuring" } },
    { c:5, ac:"var(--sky)",
      t:{ zh:"量化与对冲基金", en:"Quant & hedge funds" },
      e:{ zh:"对冲基金量化、利率量化、银行量化、CLO 量化",
          en:"Hedge fund, rates, bank and CLO quant" } },
    { c:5, ac:"var(--azure)",
      t:{ zh:"AI 与科技", en:"AI & technology" },
      e:{ zh:"AI 研究、AI 基础设施、科技",
          en:"AI research, AI infrastructure, technology" } },
    { c:5, ac:"var(--tiffany3)",
      t:{ zh:"战略、研究与数据", en:"Strategy, research & data" },
      e:{ zh:"战略财务、TMT 战略咨询、信用数据与研究、数字银行战略",
          en:"Strategic finance, TMT strategy, credit data and research, digital banking strategy" } },
    { c:3, ac:"var(--tiffany2)",
      t:{ zh:"学生与新人", en:"Students & early career" },
      e:{ zh:"在读学生、实习生、入行第一年",
          en:"Students, interns, first-year professionals" } }
  ];
  var BASE = 43;

  var ROLES = [
    { ac:"var(--tiffany)",  zh:"私募信贷 · 直接借贷", en:"Private Credit · Direct Lending" },
    { ac:"var(--tiffany)",  zh:"结构化信贷",          en:"Structured Credit" },
    { ac:"var(--tiffany)",  zh:"信用交易 · EM",       en:"Credit Trading · EM" },
    { ac:"var(--tiffany)",  zh:"CDS · 债券",          en:"CDS · Bonds" },
    { ac:"var(--tiffany)",  zh:"公开市场信用",        en:"Public Credit" },
    { ac:"var(--tiffany)",  zh:"银行 · 商业地产放贷", en:"Bank · CRE Lending" },
    { ac:"var(--pink)",     zh:"投行 · FIG",          en:"IB · FIG" },
    { ac:"var(--pink)",     zh:"投行 · 结构化融资",   en:"IB · Structured Finance" },
    { ac:"var(--pink)",     zh:"杠杆融资 · BSL",      en:"Lev Fin · BSL" },
    { ac:"var(--pink)",     zh:"重组投行",            en:"Restructuring Banking" },
    { ac:"var(--indigo)",   zh:"基建 PE",             en:"Infrastructure PE" },
    { ac:"var(--indigo)",   zh:"地产 PE",             en:"Real Estate PE" },
    { ac:"var(--indigo)",   zh:"工业 PE · 数据中心",  en:"Industrial PE · Data Centers" },
    { ac:"var(--sky)",      zh:"对冲基金量化",        en:"Hedge Fund Quant" },
    { ac:"var(--sky)",      zh:"利率量化",            en:"Rates Quant" },
    { ac:"var(--sky)",      zh:"CLO 量化",            en:"CLO Quant" },
    { ac:"var(--azure)",    zh:"AI 研究",             en:"AI Research" },
    { ac:"var(--azure)",    zh:"AI 基础设施",         en:"AI Infrastructure" },
    { ac:"var(--tiffany3)", zh:"信用数据与研究",      en:"Credit Data & Research" },
    { ac:"var(--tiffany3)", zh:"项目融资",            en:"Project Finance" }
  ];

  var TOPICS = [
    { ac:"var(--tiffany)",  zh:"私募信贷 / 信用投资", en:"Private credit & credit investing" },
    { ac:"var(--sky)",      zh:"Markets / Sales & Trading", en:"Markets / Sales & Trading" },
    { ac:"var(--pink)",     zh:"投行", en:"Investment banking" },
    { ac:"var(--indigo)",   zh:"量化", en:"Quant" },
    { ac:"var(--azure)",    zh:"AI", en:"AI" },
    { ac:"var(--tiffany3)", zh:"数据中心融资", en:"Data center financing" },
    { ac:"var(--tiffany2)", zh:"Finance × AI 创业 brainstorm", en:"Finance × AI startup brainstorm", up:{ zh:"10/17", en:"OCT 17" } }
  ];

  var T = {
    e1:{ zh:"Coffee with Onlu ✦ NYC", en:"Coffee with Onlu ✦ NYC" },
    h1:{ zh:'参与者<span class="grad">画像</span>', en:'Who <span class="grad">comes</span>' },
    s1:{ zh:"纽约华人金融从业者的线下 coffee chat 社群。每场一个话题，约 10 人。",
         en:"An in-person coffee chat community for Chinese finance professionals in New York. One topic, about ten people, each session." },
    tag:{ zh:"An Onlu Intel project", en:"An Onlu Intel project" },

    e2:{ zh:"规模", en:"Scale" },
    h2:{ zh:"7 月中旬以来", en:"Since mid-July" },
    n:[ { n:"9",    ac:"var(--tiffany)", k:{ zh:"场活动", en:"sessions" } },
        { n:"~10",  ac:"var(--sky)",     k:{ zh:"每场人数", en:"people per session" } },
        { n:"80",   ac:"var(--indigo)",  k:{ zh:"累计报名人次（含重复参与者）", en:"registrations, including repeat attendees" }, wide:true },
        { n:"150+", ac:"var(--pink)",    k:{ zh:"小红书社群成员", en:"Xiaohongshu group members" } },
        { n:"90%+", ac:"var(--tiffany2)",k:{ zh:"参与者保持微信联系", en:"of attendees stay in touch on WeChat" } } ],

    e3:{ zh:"职级", en:"Seniority" },
    h3:{ zh:"工作几年的从业者", en:"A few years in" },
    big:{ zh:"以买方、卖方的从业者为主，<b>多为 Associate 与 VP。</b>中英双语。",
          en:"Mostly buy-side and sell-side professionals, <b>largely Associates and VPs.</b> Bilingual in English and Chinese." },
    buy:{ k:{ zh:"买方", en:"Buy side" }, v:{ zh:"私募信贷、私募股权、基建与地产、对冲基金、资管", en:"Private credit, private equity, infrastructure and real estate, hedge funds, asset management" } },
    sell:{ k:{ zh:"卖方", en:"Sell side" }, v:{ zh:"投行、交易、银行放贷与结构化融资", en:"Investment banking, trading, bank lending and structured finance" } },

    e4:{ zh:"行业分布", en:"By field" },
    h4:{ zh:"信贷占比最高", en:"Credit leads" },
    f4:{ zh:"基于有完整名单的 4 场活动，共 43 位参与者（不含主办方）。", en:"Based on the four sessions with full rosters: 43 participants, excluding the host." },

    e5:{ zh:"往期同桌", en:"Who sat at the table" },
    h5:{ zh:"部分角色", en:"A sample of roles" },
    f5:{ zh:"只列角色，不列姓名与公司。", en:"Roles only; no names or firms." },

    e6:{ zh:"话题", en:"Topics" },
    h6:{ zh:"每场一个主题", en:"One theme per session" },

    e7:{ zh:"合作", en:"Partner with us" },
    h7:{ zh:'和这群人<span class="grad">建立联系</span>', en:'Reach <span class="grad">this room</span>' },
    s7:{ zh:"赞助方案与价格见：", en:"Sponsorship tiers and pricing:" },
    cta:{ zh:"coffeewithonlu.com/sponsor →", en:"coffeewithonlu.com/sponsor →" }
  };

  function slides(L){
    var max = Math.max.apply(null, FIELDS.map(function(f){return f.c;}));
    return [
      '<section class="slide"><div class="wrap">'+
        '<p class="eyebrow">'+T.e1[L]+'</p><h1>'+T.h1[L]+'</h1><p class="sub">'+T.s1[L]+'</p>'+
        '<div class="mark"><span class="cup">'+CUP+'</span><div><div class="brand">coffeewithonlu.com</div>'+
        '<div class="tag">'+T.tag[L]+'</div></div></div>'+
      '</div></section>',

      '<section class="slide"><div class="wrap">'+
        '<p class="eyebrow">'+T.e2[L]+'</p><h2>'+T.h2[L]+'</h2><div class="nums">'+
        T.n.map(function(x){ return '<div class="num'+(x.wide?' wide':'')+'" style="--ac:'+x.ac+'">'+
          '<div class="num__n">'+x.n+'</div><div class="num__k">'+x.k[L]+'</div></div>'; }).join('')+
        '</div>'+
      '</div></section>',

      '<section class="slide"><div class="wrap">'+
        '<p class="eyebrow">'+T.e3[L]+'</p><h2>'+T.h3[L]+'</h2><p class="big">'+T.big[L]+'</p>'+
        '<div class="split">'+
          '<div class="side" style="--ac:var(--tiffany)"><div class="side__k">'+T.buy.k[L]+'</div><div class="side__v">'+T.buy.v[L]+'</div></div>'+
          '<div class="side" style="--ac:var(--pink)"><div class="side__k">'+T.sell.k[L]+'</div><div class="side__v">'+T.sell.v[L]+'</div></div>'+
        '</div>'+
      '</div></section>',

      '<section class="slide"><div class="wrap">'+
        '<p class="eyebrow">'+T.e4[L]+'</p><h2>'+T.h4[L]+'</h2><div class="bars">'+
        FIELDS.map(function(f){
          var pct = Math.round(f.c/BASE*100);
          return '<div style="--ac:'+f.ac+'"><div class="bar__top"><span>'+f.t[L]+'</span>'+
            '<span class="bar__pct">'+pct+'%</span></div>'+
            '<div class="bar__track"><div class="bar__fill" style="width:'+(f.c/max*100)+'%"></div></div>'+
            '<div class="bar__eg">'+f.e[L]+'</div></div>';
        }).join('')+
        '</div><p class="foot">'+T.f4[L]+'</p>'+
      '</div></section>',

      '<section class="slide"><div class="wrap">'+
        '<p class="eyebrow">'+T.e5[L]+'</p><h2>'+T.h5[L]+'</h2><div class="chips">'+
        ROLES.map(function(r){ return '<span class="chip" style="--ac:'+r.ac+'">'+r[L]+'</span>'; }).join('')+
        '</div><p class="foot">'+T.f5[L]+'</p>'+
      '</div></section>',

      '<section class="slide"><div class="wrap">'+
        '<p class="eyebrow">'+T.e6[L]+'</p><h2>'+T.h6[L]+'</h2><ul class="topics">'+
        TOPICS.map(function(t,i){ return '<li style="--ac:'+t.ac+'"><span class="n">0'+(i+1)+'</span><span>'+t[L]+'</span>'+
          (t.up ? '<span class="up">'+t.up[L]+'</span>' : '')+'</li>'; }).join('')+
        '</ul>'+
      '</div></section>',

      '<section class="slide"><div class="wrap">'+
        '<p class="eyebrow">'+T.e7[L]+'</p><h1 style="font-size:clamp(1.9rem,8.6vw,3.6rem)">'+T.h7[L]+'</h1>'+
        '<p class="sub">'+T.s7[L]+'</p>'+
        '<a class="cta" href="/sponsor/?lang='+L+'">'+T.cta[L]+'</a>'+
        '<div class="mark"><span class="cup">'+CUP+'</span><div><div class="brand">coffeewithonlu.com</div>'+
        '<div class="tag">'+T.tag[L]+'</div></div></div>'+
      '</div></section>'
    ];
  }

  var lang = "zh";
  try { if (localStorage.getItem("onlu-sponsor-lang") === "en") lang = "en"; } catch(e){}
  var q = (location.search.match(/[?&]lang=(en|zh)/) || [])[1];
  if (q) lang = q;

  var deck=document.getElementById('deck'), dotsWrap=document.getElementById('dots');
  var i=0, els, dots;
  function paint(){
    deck.innerHTML = slides(lang).join('');
    els = deck.querySelectorAll('.slide');
    if(!dots){
      for(var d=0; d<els.length; d++){
        var b=document.createElement('button'); b.className='dot'; b.setAttribute('aria-label','Slide '+(d+1));
        (function(idx){ b.addEventListener('click', function(){ go(idx); }); })(d);
        dotsWrap.appendChild(b);
      }
      dots = dotsWrap.querySelectorAll('.dot');
    }
    var lb=document.getElementById('lang');
    lb.innerHTML = lang==='en' ? '中文 / <b>EN</b>' : '<b>中文</b> / EN';
    document.documentElement.lang = lang;
    document.title = lang==='en' ? 'Who comes — Coffee with Onlu' : '参与者画像 — Coffee with Onlu';
    go(i);
  }
  function go(n){
    i=Math.max(0,Math.min(els.length-1,n));
    for(var k=0;k<els.length;k++){ els[k].classList.toggle('is-active',k===i); dots[k].classList.toggle('on',k===i); }
    els[i].scrollTop=0;
  }
  document.getElementById('next').addEventListener('click',function(){go(i+1);});
  document.getElementById('prev').addEventListener('click',function(){go(i-1);});
  document.getElementById('lang').addEventListener('click',function(e){
    e.stopPropagation(); lang = lang==='en' ? 'zh' : 'en';
    try{ localStorage.setItem('onlu-sponsor-lang',lang); }catch(err){}
    paint();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(i+1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();go(i-1);}
  });
  var x0=null,y0=null;
  document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchend',function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) go(dx<0?i+1:i-1);
    x0=null;y0=null;
  },{passive:true});
  paint();
})();
</script>
</body>
</html>
