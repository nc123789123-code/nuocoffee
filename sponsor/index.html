<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{
  --bg:#0a1520; --surface:rgba(255,255,255,.035);
  --text:#eef6fb; --muted:#93aec4; --dim:#6d8aa3; --line:rgba(150,200,230,.14);
  --tiffany:#2ee0d0; --tiffany2:#9befe4; --tiffany3:#0fa89f;
  --sky:#4cc4ff; --azure:#4d84ff; --indigo:#8a9bff; --pink:#ff4f9a;
  --display:'Unbounded',system-ui,sans-serif;
  --body:'Outfit',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'Space Mono',ui-monospace,'Courier New',monospace;
  --grad:linear-gradient(100deg,var(--tiffany2),var(--tiffany) 30%,var(--sky) 58%,var(--pink) 92%);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;
  line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding-bottom:60px;overflow-x:hidden;}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(90px);}
.b1{width:80vw;height:80vw;top:-26vh;right:-30vw;background:radial-gradient(circle,var(--tiffany),transparent 68%);opacity:.22;}
.b2{width:75vw;height:75vw;bottom:-14vh;left:-30vw;background:radial-gradient(circle,var(--pink),transparent 68%);opacity:.13;}
.wrap{position:relative;z-index:1;max-width:680px;margin-inline:auto;padding:0 18px;}

.jump{position:sticky;top:0;z-index:20;background:rgba(6,14,22,.9);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.jump__in{max-width:680px;margin-inline:auto;padding:10px 18px;display:flex;gap:8px;
  align-items:center;overflow-x:auto;scrollbar-width:none;}
.jump__in::-webkit-scrollbar{display:none;}
.jump a{flex:none;white-space:nowrap;font-family:var(--mono);font-size:.72rem;font-weight:700;
  letter-spacing:.06em;color:var(--muted);text-decoration:none;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);-webkit-tap-highlight-color:transparent;}
.jump .lang{margin-left:auto;flex:none;white-space:nowrap;font-family:var(--mono);font-weight:700;
  font-size:.7rem;letter-spacing:.1em;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;}

header{padding:32px 0 6px;}
.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;
  font-size:.68rem;font-weight:700;color:var(--tiffany2);}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.06;
  font-size:clamp(1.8rem,8vw,2.6rem);margin:.32em 0 .3em;}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.lede{font-size:1rem;color:var(--muted);line-height:1.5;}
.lede b{color:var(--text);}

h2{font-family:var(--display);font-weight:600;letter-spacing:-.015em;font-size:1.1rem;
  margin:40px 0 8px;display:flex;align-items:center;gap:9px;scroll-margin-top:60px;}
h2::before{content:"";width:9px;height:9px;border-radius:50%;flex:none;
  background:var(--ac,var(--tiffany));box-shadow:0 0 12px var(--ac,var(--tiffany));}
.intro{font-size:.9rem;color:var(--muted);margin-bottom:14px;}

.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:15px;
  margin-bottom:10px;border-left:3px solid var(--ac,var(--tiffany));}
.card p{font-size:.9rem;color:var(--muted);line-height:1.55;}
.card p + p{margin-top:8px;}
.card b{color:var(--text);font-weight:600;}
.card ul{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:8px;}
.card li{position:relative;padding-left:16px;font-size:.89rem;color:var(--muted);line-height:1.5;}
.card li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;
  background:var(--ac,var(--tiffany));opacity:.75;}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
.stat{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:14px;
  border-left:3px solid var(--ac,var(--tiffany));}
.stat__n{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:1.5rem;
  line-height:1.1;color:var(--ac,var(--tiffany));}
.stat__k{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.35;}

/* tiers */
.tier{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:17px;
  margin-bottom:10px;border-left:3px solid var(--ac,var(--tiffany));}
.tier__top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.tier__n{font-weight:600;font-size:1.02rem;}
.tier__p{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;
  color:var(--ac,var(--tiffany));white-space:nowrap;}
.tier__s{font-family:var(--mono);font-size:.68rem;color:var(--dim);letter-spacing:.04em;margin-top:2px;}
.tier ul{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line);}
.tier li{position:relative;padding-left:16px;font-size:.89rem;color:var(--muted);line-height:1.5;}
.tier li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;
  background:var(--ac,var(--tiffany));opacity:.8;}

.warn{padding:13px 15px;border-radius:13px;margin-bottom:10px;
  border:1px solid rgba(255,79,154,.3);background:rgba(255,79,154,.09);
  font-size:.88rem;color:#ffc9de;line-height:1.55;}
.warn b{color:#fff;}
.todo{color:var(--pink);font-weight:700;}

.cta{display:block;margin-top:20px;text-align:center;font-family:var(--mono);font-weight:700;
  text-transform:uppercase;letter-spacing:.14em;font-size:.8rem;color:#08131c;background:var(--grad);
  padding:16px 22px;border-radius:999px;text-decoration:none;
  box-shadow:0 0 40px -10px rgba(255,79,154,.6);}
.foot{margin:40px 0 10px;padding-top:20px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:.72rem;color:var(--dim);line-height:1.8;}
.foot a{color:var(--tiffany2);}
/* room: buy/sell split, field bars, role chips */
.split{display:grid;grid-template-columns:1fr;gap:8px;margin-top:11px;}
@media (min-width:520px){ .split{grid-template-columns:1fr 1fr;} }
.side{border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.025);padding:10px 12px;
  border-left:3px solid var(--ac);}
.side__k{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);}
.side__v{font-size:.86rem;color:var(--muted);margin-top:4px;line-height:1.45;}
.bars{display:flex;flex-direction:column;gap:13px;margin-top:12px;}
.bar__top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:.92rem;color:var(--text);}
.bar__pct{font-family:var(--mono);font-weight:700;color:var(--ac);font-size:.84rem;flex:none;}
.bar__track{height:8px;border-radius:999px;background:rgba(255,255,255,.06);margin-top:5px;overflow:hidden;}
.bar__fill{height:100%;border-radius:999px;background:var(--ac);box-shadow:0 0 12px var(--ac);}
.bar__eg{font-size:.78rem;color:var(--dim);margin-top:4px;line-height:1.4;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);
  border-radius:999px;background:rgba(255,255,255,.03);font-size:.82rem;line-height:1.2;color:var(--text);}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;flex:none;background:var(--ac);box-shadow:0 0 8px var(--ac);}
.card .small{font-family:var(--mono);font-size:.68rem;color:var(--dim);margin-top:11px;line-height:1.6;}
</style>
</head>

      s:{ zh:"一次活动", en:"one event" },
      l:{ zh:["以支持方名义为到场者提供咖啡",
              "活动页与宣传图上的 logo 与一句话介绍",
              "开场时由主持致谢",
              "微信群、小红书、Instagram 发布时署名",
              "可派 1–2 人以普通参与者身份到场"],
          en:["Coffee for every attendee, offered in your name",
              "Logo and one line on the event page and the cards",
              "A thank-you from the host at the open",
              "Named in the WeChat, Xiaohongshu and Instagram posts",
              "One or two seats, attending as participants like everyone else"] } },
    { ac:"var(--pink)", n:{ zh:"四场", en:"Four sessions" }, p:{ zh:"$900", en:"$900" },
      s:{ zh:"四次活动", en:"four events" },
      l:{ zh:["单场所有权益 × 4",
              "coffeewithonlu.com 上的常驻署名",
              "优先选择赞助哪几场主题",
              "一份参与者构成小结（<b>只有汇总，无个人信息</b>）"],
          en:["Everything in the single tier, four times",
              "A standing credit on coffeewithonlu.com",
              "First choice of which themes to sponsor",
              "A summary of who attended (<b>aggregate only, no individual data</b>)"] } }
  ];

  var lang = "zh";
  try { if (localStorage.getItem("onlu-sponsor-lang") === "en") lang = "en"; } catch(e){}
  var q = (location.search.match(/[?&]lang=(en|zh)/) || [])[1];
  if (q) lang = q;   // a shared ?lang= link always wins

  function paint(){
    document.getElementById("h1").innerHTML = T.h1[lang];
    document.getElementById("lede").innerHTML = T.lede[lang];
    document.getElementById("h-room").textContent = T.hRoom[lang];
    document.getElementById("i-room").textContent = T.iRoom[lang];
    ["i-room","i-record","i-tiers"].forEach(function(id){ var e=document.getElementById(id); e.hidden = !e.textContent; });
    document.getElementById("h-record").textContent = T.hRec[lang];
    document.getElementById("i-record").textContent = T.iRec[lang];
    document.getElementById("h-tiers").textContent = T.hTier[lang];
    document.getElementById("i-tiers").textContent = T.iTier[lang];
    ["i-room","i-record","i-tiers"].forEach(function(id){ var e=document.getElementById(id); e.hidden = !e.textContent; });
    document.getElementById("cta").textContent = T.cta[lang];
    document.getElementById("j1").textContent = T.j1[lang];
    document.getElementById("j2").textContent = T.j2[lang];
    document.getElementById("j3").textContent = T.j3[lang];

    var R = ROOM, L = lang;
    var maxC = Math.max.apply(null, FIELDS.map(function(f){ return f.c; }));
    document.getElementById("room-list").innerHTML =
      '<div class="card" style="--ac:var(--sky)"><p><b>'+R.seniority.t[L]+'</b></p><p>'+R.seniority.p[L]+'</p>'+
        '<div class="split">'+
          '<div class="side" style="--ac:var(--tiffany)"><div class="side__k">'+R.seniority.buy.k[L]+'</div><div class="side__v">'+R.seniority.buy.v[L]+'</div></div>'+
          '<div class="side" style="--ac:var(--pink)"><div class="side__k">'+R.seniority.sell.k[L]+'</div><div class="side__v">'+R.seniority.sell.v[L]+'</div></div>'+
        '</div></div>'+
      '<div class="card" style="--ac:var(--tiffany)"><p><b>'+R.fields.t[L]+'</b></p><div class="bars">'+
        FIELDS.map(function(f){
          return '<div style="--ac:'+f.ac+'"><div class="bar__top"><span>'+f.t[L]+'</span>'+
            '<span class="bar__pct">'+f.pct+'%</span></div>'+
            '<div class="bar__track"><div class="bar__fill" style="width:'+(f.c/maxC*100)+'%"></div></div>'+
            '<div class="bar__eg">'+f.e[L]+'</div></div>';
        }).join('')+
        '</div><p class="small">'+R.fields.note[L]+'</p></div>'+
      '<div class="card" style="--ac:var(--indigo)"><p><b>'+R.roles.t[L]+'</b></p><div class="chips">'+
        ROLES.map(function(r){ return '<span class="chip" style="--ac:'+r.ac+'">'+r[L]+'</span>'; }).join('')+
        '</div><p class="small">'+R.roles.note[L]+'</p></div>'+
      '<div class="card" style="--ac:var(--pink)"><p><b>'+R.community.t[L]+'</b></p><p>'+R.community.p[L]+'</p></div>';

    document.getElementById("stats").innerHTML = STATS.map(function(x){
      return '<div class="stat" style="--ac:'+x.ac+'"><div class="stat__n">'+x.n[lang]+
             '</div><div class="stat__k">'+x.k[lang]+'</div></div>';
    }).join("");

    document.getElementById("record-list").innerHTML = RECORD.map(function(x){
      return '<div class="card" style="--ac:'+x.ac+'"><p><b>'+x.t[lang]+'</b></p><p>'+x.p[lang]+'</p></div>';
    }).join("");

    document.getElementById("tier-list").innerHTML = TIERS.map(function(x){
      return '<div class="tier" style="--ac:'+x.ac+'">'+
        '<div class="tier__top"><div><div class="tier__n">'+x.n[lang]+'</div>'+
        '<div class="tier__s">'+x.s[lang]+'</div></div>'+
        '<div class="tier__p">'+x.p[lang]+'</div></div>'+
        '<ul>'+x.l[lang].map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul></div>';
    }).join("");


    document.getElementById("lang").innerHTML = lang === "en" ? '中文 / <b style="color:#eef6fb">EN</b>' : '<b style="color:#eef6fb">中文</b> / EN';
    document.documentElement.lang = lang === "en" ? "en" : "zh";
  }

  document.getElementById("lang").addEventListener("click", function(){
    lang = lang === "en" ? "zh" : "en";
    try { localStorage.setItem("onlu-sponsor-lang", lang); } catch(e){}
    paint();
  });
  paint();
})();
</script>
</body>
</html>
