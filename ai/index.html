<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Onlu AI Coffee — Coffee with Onlu</title>
<meta name="description" content="Onlu AI x Finance coffee chat in NYC — quants, AI builders, and investors around one table." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a1520" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232ee0d0%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M5%209h11v4a4%204%200%200%201-4%204H9a4%204%200%200%201-4-4V9Z%22%2F%3E%3Cpath%20d%3D%22M16%2010h2.4a2.4%202.4%200%200%201%200%204.8H16%22%2F%3E%3Cpath%20d%3D%22M8%203.4c-.5%201%20.5%201.6%200%202.6M11.5%203.4c-.5%201%20.5%201.6%200%202.6%22%2F%3E%3C%2Fsvg%3E" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

:root{
  --bg:#0a1520;
  --text:#eef6fb; --muted:#93aec4; --dim:#6d8aa3; --line:rgba(150,200,230,.16);
  --tiffany:#2ee0d0; --tiffany2:#9befe4; --tiffany3:#0fa89f;
  --sky:#4cc4ff; --azure:#4d84ff; --indigo:#8a9bff; --pink:#ff4f9a;
  --onlu-mint:#6aab8e; --onlu-tan:#c99a6a;
  --display:'Unbounded',system-ui,sans-serif;
  --body:'Outfit',system-ui,-apple-system,sans-serif;
  --mono:'Space Mono',ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--body);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}

.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(80px);}
.b1{width:75vw;height:75vw;top:-22vh;right:-28vw;background:radial-gradient(circle,var(--tiffany),transparent 68%);opacity:.36;}
.b2{width:70vw;height:70vw;bottom:-18vh;left:-28vw;background:radial-gradient(circle,var(--pink),transparent 68%);opacity:.24;}

.deck{position:relative;z-index:1;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
  padding:clamp(24px,6vw,72px);padding-bottom:clamp(70px,12vh,100px);overflow-y:auto;}
.slide.is-active{display:flex;}
.deck,.slide{height:100vh;}
@supports (height:100dvh){ .deck,.slide{height:100dvh;} }
.wrap{width:100%;max-width:880px;margin-inline:auto;}

.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;
  font-size:clamp(.66rem,2.7vw,.8rem);font-weight:700;color:var(--tiffany2);}
.grad{background:linear-gradient(100deg,var(--tiffany2),var(--tiffany) 30%,var(--sky) 58%,var(--pink) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-wrap:balance;}

/* slide 1 — Onlu */
.about h1{font-size:clamp(2.1rem,9.5vw,4.4rem);margin:.32em 0 .4em;}
.about .sub{font-size:clamp(1rem,4.2vw,1.4rem);color:var(--muted);line-height:1.45;max-width:30ch;}
.facts{list-style:none;display:flex;flex-direction:column;gap:clamp(10px,2.4vw,14px);
  margin-top:clamp(22px,5vw,34px);}
.facts li{display:flex;align-items:flex-start;gap:12px;
  font-size:clamp(.95rem,3.9vw,1.15rem);line-height:1.4;}
.facts li::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;margin-top:.5em;
  background:var(--tiffany);box-shadow:0 0 12px var(--tiffany);}
.mark{margin-top:clamp(24px,5.5vw,40px);display:flex;align-items:center;gap:10px;}
.cup{color:var(--tiffany2);filter:drop-shadow(0 0 12px rgba(46,224,208,.5));line-height:0;}
.cup svg{width:24px;height:24px;display:block;}
.brand{font-family:var(--display);font-weight:600;font-size:clamp(.95rem,3.6vw,1.05rem);}
.tag{font-family:var(--mono);font-size:clamp(.7rem,2.9vw,.78rem);color:var(--dim);margin-top:3px;}

/* slide 2 — the table */
.all h2{font-size:clamp(1.5rem,6.8vw,2.7rem);margin:.35em 0 .75em;}
.seats{display:grid;grid-template-columns:1fr;gap:clamp(7px,1.8vw,10px);}
@media (min-width:640px){ .seats{grid-template-columns:1fr 1fr;} }
.seat{display:flex;align-items:center;gap:11px;
  padding:clamp(9px,2.3vw,13px) clamp(12px,3vw,16px);
  border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);
  font-size:clamp(.88rem,3.7vw,1.02rem);}
.seat .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ac);box-shadow:0 0 10px var(--ac);}
.foot{margin-top:clamp(18px,4vw,26px);font-family:var(--mono);font-size:clamp(.72rem,3vw,.82rem);color:var(--dim);}

.nav{position:fixed;top:0;bottom:clamp(70px,12vh,100px);z-index:2;width:32%;border:none;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.nav.prev{left:0;} .nav.next{right:0;}
.dots{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  z-index:3;display:flex;gap:6px;justify-content:center;align-items:center;}
.dot{width:28px;height:28px;padding:0;border:none;background:transparent;cursor:pointer;
  display:grid;place-items:center;-webkit-tap-highlight-color:transparent;}
.dot::after{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .2s,transform .2s;}
.dot.on::after{background:var(--tiffany2);transform:scale(1.45);}
</style>
</head>
<body>


<div class="fx"><span class="blob b1"></span><span class="blob b2"></span></div>
<div class="deck" id="deck"></div>
<button class="nav prev" id="prev" aria-label="Previous"></button>
<button class="nav next" id="next" aria-label="Next"></button>
<div class="dots" id="dots"></div>

<script>
var CUP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h11v4a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9Z"/><path d="M16 10h2.4a2.4 2.4 0 0 1 0 4.8H16"/><path d="M8 3.4c-.5 1 .5 1.6 0 2.6M11.5 3.4c-.5 1 .5 1.6 0 2.6"/></svg>';

var SEATS=[
  {name:'AI Research',            ac:'var(--sky)'},
  {name:'AI Infrastructure',      ac:'var(--sky)'},
  {name:'AI / Video',             ac:'var(--sky)'},
  {name:'Hedge Fund Founder',     ac:'var(--indigo)'},
  {name:'Hedge Fund Quant',       ac:'var(--tiffany)'},
  {name:'Rates Quant',            ac:'var(--tiffany)'},
  {name:'Bank Quant',             ac:'var(--tiffany3)'},
  {name:'CLO Quant',              ac:'var(--tiffany3)'},
  {name:'Investment Management',  ac:'var(--azure)'},
  {name:'Strategic Finance',      ac:'var(--azure)'},
  {name:'Students & Interns',     ac:'var(--pink)'}
];

var slides=[
  '<section class="slide about"><div class="wrap">'+
    '<p class="eyebrow">Onlu AI × Finance ✦ NYC</p>'+
    '<h1>Coffee <span class="grad">with Onlu</span></h1>'+
    '<p class="sub">Small-group coffees and dinners for people in finance — grouped by what you actually do.</p>'+
    '<ul class="facts">'+
      '<li>Tables of 4–6, never a random mixer</li>'+
      '<li>Weekend coffees by vertical, plus dinners</li>'+
      '<li>No pitching — just the people worth knowing</li>'+
    '</ul>'+
    '<div class="mark"><span class="cup">'+CUP+'</span><div>'+
      '<div class="brand">coffeewithonlu.com</div>'+
      '<div class="tag">An Onlu Intel project · NYC first</div>'+
    '</div></div>'+
  '</div></section>',

  '<section class="slide all"><div class="wrap">'+
    '<p class="eyebrow">The table</p>'+
    '<h2>Where AI meets the market.</h2>'+
    '<div class="seats">'+SEATS.map(function(s){
      return '<div class="seat" style="--ac:'+s.ac+'"><span class="dot"></span><span>'+s.name+'</span></div>';
    }).join('')+'</div>'+
    '<p class="foot">Sunday, Aug 30 · 2:30 PM · NYC</p>'+
  '</div></section>'
];

var deck=document.getElementById('deck');
deck.innerHTML=slides.join('');
var els=deck.querySelectorAll('.slide');
var dotsWrap=document.getElementById('dots');
var i=0;
for(var d=0;d<els.length;d++){
  var b=document.createElement('button');
  b.className='dot'; b.setAttribute('aria-label','Slide '+(d+1));
  (function(idx){b.addEventListener('click',function(){go(idx);});})(d);
  dotsWrap.appendChild(b);
}
var dots=dotsWrap.querySelectorAll('.dot');
function go(n){
  i=Math.max(0,Math.min(els.length-1,n));
  for(var k=0;k<els.length;k++){els[k].classList.toggle('is-active',k===i);dots[k].classList.toggle('on',k===i);}
  els[i].scrollTop=0;
}
document.getElementById('next').addEventListener('click',function(){go(i+1);});
document.getElementById('prev').addEventListener('click',function(){go(i-1);});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(i+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(i-1);}
});
var x0=null,y0=null;
document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',function(e){
  if(x0===null)return;
  var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) go(dx<0 ? i+1 : i-1);
  x0=null;y0=null;
},{passive:true});
go(0);
</script>

</body>
</html>
