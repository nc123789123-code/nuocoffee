<!doctype html>
<meta charset="utf-8">
<title>Onlu Coffee Chat — brand set</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Space+Mono:wght@700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#2a2a2a;display:flex;flex-wrap:wrap;gap:30px;padding:30px;}
.t{position:relative;display:flex;align-items:center;justify-content:center;background:#0a1520;overflow:hidden;isolation:isolate;}
.t::before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,rgba(46,224,208,.16),transparent 65%);filter:blur(50px);z-index:-1;}
.t.light{background:#f6f1e9;} .t.light::before,.t.clear::before{display:none;} .t.clear{background:transparent;}
.name{font-family:'Unbounded',sans-serif;font-weight:800;letter-spacing:-.035em;line-height:1;color:#eef6fb;}
.light .name{color:#0a1520;}
.sub{font-family:'Unbounded',sans-serif;font-weight:600;letter-spacing:-.01em;line-height:1;
  background:linear-gradient(100deg,#9befe4,#2ee0d0 30%,#4cc4ff 62%,#ff4f9a);-webkit-background-clip:text;background-clip:text;color:transparent;}
.light .sub{background:linear-gradient(100deg,#0fa89f,#1aa6d6 55%,#e8407f);-webkit-background-clip:text;background-clip:text;}
.tag{font:700 24px 'Space Mono',monospace;letter-spacing:.42em;color:#6d8aa3;text-transform:uppercase;}
.light .tag{color:#8a7f72;}
</style>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9befe4"/><stop offset=".35" stop-color="#2ee0d0"/><stop offset=".65" stop-color="#4cc4ff"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient>
  <radialGradient id="coffee" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#5a3624"/><stop offset="1" stop-color="#2a170f"/></radialGradient>
</defs></svg>

<!-- horizontal lockup, dark -->
<div class="t" id="h-dark" style="width:1800px;height:640px;gap:64px"><svg viewBox="130 130 740 740" width="400" height="400" style="display:block;flex:none">
  <circle cx="500" cy="500" r="350" fill="rgba(255,255,255,.04)" stroke="rgba(150,200,230,.22)" stroke-width="6"/>
  <circle cx="500" cy="500" r="275" fill="url(#g)"/>
  <circle cx="500" cy="500" r="236" fill="url(#coffee)"/>
  <path d="M410 395 H590 A80 80 0 0 1 670 475 V505 A80 80 0 0 1 590 585 H460 L392 640 L408 578 A80 80 0 0 1 330 505 V475 A80 80 0 0 1 410 395 Z" fill="#f3e6d3"/>
  <circle cx="430" cy="490" r="20" fill="#5a3624"/><circle cx="500" cy="490" r="20" fill="#5a3624"/><circle cx="570" cy="490" r="20" fill="#5a3624"/>
</svg>
  <div><div class="name" style="font-size:150px">Onlu</div><div class="sub" style="font-size:84px;margin-top:22px">Coffee Chat</div><div class="tag" style="margin-top:34px">New York · Finance</div></div></div>

<!-- horizontal lockup, light -->
<div class="t light" id="h-light" style="width:1800px;height:640px;gap:64px"><svg viewBox="130 130 740 740" width="400" height="400" style="display:block;flex:none">
  <circle cx="500" cy="500" r="350" fill="rgba(10,21,32,.05)" stroke="rgba(10,21,32,.18)" stroke-width="6"/>
  <circle cx="500" cy="500" r="275" fill="url(#g)"/>
  <circle cx="500" cy="500" r="236" fill="url(#coffee)"/>
  <path d="M410 395 H590 A80 80 0 0 1 670 475 V505 A80 80 0 0 1 590 585 H460 L392 640 L408 578 A80 80 0 0 1 330 505 V475 A80 80 0 0 1 410 395 Z" fill="#f3e6d3"/>
  <circle cx="430" cy="490" r="20" fill="#5a3624"/><circle cx="500" cy="490" r="20" fill="#5a3624"/><circle cx="570" cy="490" r="20" fill="#5a3624"/>
</svg>
  <div><div class="name" style="font-size:150px">Onlu</div><div class="sub" style="font-size:84px;margin-top:22px">Coffee Chat</div><div class="tag" style="margin-top:34px">New York · Finance</div></div></div>

<!-- square post / profile card, stacked -->
<div class="t" id="square" style="width:1080px;height:1080px;flex-direction:column;gap:50px"><svg viewBox="130 130 740 740" width="520" height="520" style="display:block;flex:none">
  <circle cx="500" cy="500" r="350" fill="rgba(255,255,255,.04)" stroke="rgba(150,200,230,.22)" stroke-width="6"/>
  <circle cx="500" cy="500" r="275" fill="url(#g)"/>
  <circle cx="500" cy="500" r="236" fill="url(#coffee)"/>
  <path d="M410 395 H590 A80 80 0 0 1 670 475 V505 A80 80 0 0 1 590 585 H460 L392 640 L408 578 A80 80 0 0 1 330 505 V475 A80 80 0 0 1 410 395 Z" fill="#f3e6d3"/>
  <circle cx="430" cy="490" r="20" fill="#5a3624"/><circle cx="500" cy="490" r="20" fill="#5a3624"/><circle cx="570" cy="490" r="20" fill="#5a3624"/>
</svg>
  <div style="text-align:center"><div class="name" style="font-size:112px">Onlu</div><div class="sub" style="font-size:62px;margin-top:18px">Coffee Chat</div></div></div>

<!-- avatar: mark only, sized for a circle crop -->
<div class="t" id="avatar" style="width:1000px;height:1000px"><svg viewBox="130 130 740 740" width="800" height="800" style="display:block;flex:none">
  <circle cx="500" cy="500" r="350" fill="rgba(255,255,255,.04)" stroke="rgba(150,200,230,.22)" stroke-width="6"/>
  <circle cx="500" cy="500" r="275" fill="url(#g)"/>
  <circle cx="500" cy="500" r="236" fill="url(#coffee)"/>
  <path d="M410 395 H590 A80 80 0 0 1 670 475 V505 A80 80 0 0 1 590 585 H460 L392 640 L408 578 A80 80 0 0 1 330 505 V475 A80 80 0 0 1 410 395 Z" fill="#f3e6d3"/>
  <circle cx="430" cy="490" r="20" fill="#5a3624"/><circle cx="500" cy="490" r="20" fill="#5a3624"/><circle cx="570" cy="490" r="20" fill="#5a3624"/>
</svg></div>

<!-- transparent mark -->
<div class="t clear" id="mark" style="width:1000px;height:1000px"><svg viewBox="130 130 740 740" width="1000" height="1000" style="display:block;flex:none">
  <circle cx="500" cy="500" r="350" fill="none" stroke="none" stroke-width="6"/>
  <circle cx="500" cy="500" r="275" fill="url(#g)"/>
  <circle cx="500" cy="500" r="236" fill="url(#coffee)"/>
  <path d="M410 395 H590 A80 80 0 0 1 670 475 V505 A80 80 0 0 1 590 585 H460 L392 640 L408 578 A80 80 0 0 1 330 505 V475 A80 80 0 0 1 410 395 Z" fill="#f3e6d3"/>
  <circle cx="430" cy="490" r="20" fill="#5a3624"/><circle cx="500" cy="490" r="20" fill="#5a3624"/><circle cx="570" cy="490" r="20" fill="#5a3624"/>
</svg></div>
