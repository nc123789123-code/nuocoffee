<!doctype html>
<meta charset="utf-8">
<title>Coffee with Onlu — logo concepts, round 3</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Outfit:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#0a1520; --text:#eef6fb; --muted:#93aec4; --dim:#6d8aa3;
  --tiffany:#2ee0d0; --tiffany2:#9befe4; --sky:#4cc4ff; --pink:#ff4f9a;
  --display:'Unbounded',system-ui,sans-serif; --body:'Outfit',system-ui,sans-serif; --mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#2a2a2a;display:flex;flex-wrap:wrap;gap:30px;padding:30px;font-family:var(--body);}
.tile{position:relative;width:800px;height:800px;background:var(--bg);display:grid;place-items:center;overflow:hidden;isolation:isolate;}
.tile.light{background:#f5f1ea;}
.tile::before{content:"";position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle,rgba(46,224,208,.20),transparent 65%);filter:blur(40px);z-index:-1;}
.tile.light::before{display:none;}
.wide{width:1640px;height:560px;}
.label{position:absolute;left:28px;top:22px;font:700 20px var(--mono);letter-spacing:.14em;color:var(--dim);}
.light .label{color:#9a8f80;}
svg{display:block;overflow:visible;}
.lock{display:flex;flex-direction:column;align-items:center;gap:26px;}
.word{font-family:var(--display);font-weight:800;letter-spacing:-.04em;color:var(--text);line-height:1;}
.light .word{color:#0a1520;}
.sub{font:700 22px var(--mono);letter-spacing:.32em;color:var(--muted);text-transform:uppercase;}
.light .sub{color:#7a6f62;}
.row{display:flex;align-items:center;}
</style>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9befe4"/><stop offset=".35" stop-color="#2ee0d0"/>
      <stop offset=".65" stop-color="#4cc4ff"/><stop offset="1" stop-color="#ff4f9a"/>
    </linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9befe4"/><stop offset="1" stop-color="#2ee0d0"/>
    </linearGradient>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc4ff"/><stop offset="1" stop-color="#ff4f9a"/>
    </linearGradient>
  </defs>
</svg>


<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gv" gradientUnits="userSpaceOnUse" x1="0" y1="470" x2="0" y2="60"><stop offset="0" stop-color="#2ee0d0"/><stop offset=".5" stop-color="#4cc4ff"/><stop offset=".8" stop-color="#ff4f9a" stop-opacity=".75"/><stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/></linearGradient>
  <linearGradient id="gk" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2ee0d0"/><stop offset=".6" stop-color="#4cc4ff"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient>
  <radialGradient id="coffee" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#5a3624"/><stop offset="1" stop-color="#2a170f"/></radialGradient>
</defs></svg>

<!-- J · Latte art that is a speech bubble -->
<div class="tile" id="j"><span class="label">J · LATTE TALK</span>
  <svg viewBox="0 0 1000 1000" width="640" height="640">
    <circle cx="480" cy="500" r="350" fill="rgba(255,255,255,.04)" stroke="rgba(150,200,230,.22)" stroke-width="6"/>
    <path d="M748 500 H860" stroke="url(#gp)" stroke-width="64" stroke-linecap="round"/>
    <circle cx="480" cy="500" r="275" fill="url(#g)"/>
    <circle cx="480" cy="500" r="236" fill="url(#coffee)"/>
    <path d="M390 395 H570 A80 80 0 0 1 650 475 V505 A80 80 0 0 1 570 585 H440 L372 640 L388 578 A80 80 0 0 1 310 505 V475 A80 80 0 0 1 390 395 Z" fill="#f3e6d3"/>
    <circle cx="410" cy="490" r="20" fill="#5a3624"/><circle cx="480" cy="490" r="20" fill="#5a3624"/><circle cx="550" cy="490" r="20" fill="#5a3624"/>
  </svg>
</div>

<!-- K · The steam is a market chart -->
<div class="tile" id="k"><span class="label">K · BULLISH BREW</span>
  <svg viewBox="0 0 1000 1000" width="640" height="640">
    <polyline points="350,470 405,395 455,425 520,300 570,340 660,190" fill="none" stroke="url(#gk)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M610 180 L672 176 L668 238" fill="none" stroke="#ff4f9a" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M690 560 h36 a78 78 0 0 1 0 156 h-40" fill="none" stroke="url(#gp)" stroke-width="50" stroke-linecap="round"/>
    <path d="M280 510 H700 V630 A200 200 0 0 1 500 830 H480 A200 200 0 0 1 280 630 Z" fill="url(#g)"/>
    <path d="M230 880 H770" stroke="rgba(150,200,230,.35)" stroke-width="22" stroke-linecap="round"/>
  </svg>
</div>

<!-- L · Manhattan rises out of the cup -->
<div class="tile" id="l"><span class="label">L · NYC STEAM</span>
  <svg viewBox="0 0 1000 1000" width="640" height="640">
    <rect x="330" y="350" width="38" height="120" rx="4" fill="url(#gv)"/><rect x="372" y="295" width="30" height="175" rx="4" fill="url(#gv)"/><rect x="406" y="330" width="44" height="140" rx="4" fill="url(#gv)"/><rect x="454" y="220" width="40" height="250" rx="4" fill="url(#gv)"/><rect x="498" y="140" width="34" height="330" rx="4" fill="url(#gv)"/><rect x="536" y="265" width="42" height="205" rx="4" fill="url(#gv)"/><rect x="582" y="320" width="30" height="150" rx="4" fill="url(#gv)"/><rect x="616" y="360" width="34" height="110" rx="4" fill="url(#gv)"/><rect x="512" y="70" width="6" height="80" rx="3" fill="url(#gv)"/>
    <path d="M700 560 h36 a78 78 0 0 1 0 156 h-40" fill="none" stroke="url(#gp)" stroke-width="50" stroke-linecap="round"/>
    <path d="M290 500 H710 V630 A200 200 0 0 1 510 830 H490 A200 200 0 0 1 290 630 Z" fill="url(#g)"/>
  </svg>
</div>

<!-- N · Two coffee-ring stains that met on the same table -->
<div class="tile" id="n"><span class="label">N · COFFEE RINGS</span>
  <svg viewBox="0 0 1000 1000" width="660" height="660">
    <g style="mix-blend-mode:screen"><circle cx="395" cy="500" r="209" fill="none" stroke="#2ee0d0" stroke-width="9" opacity="0.95" stroke-dasharray="1129 184" transform="rotate(165 395 500)"/><circle cx="395" cy="500" r="215" fill="none" stroke="#2ee0d0" stroke-width="20" opacity="0.45" stroke-dasharray="1162 189" transform="rotate(77 395 500)"/><circle cx="395" cy="500" r="222" fill="none" stroke="#2ee0d0" stroke-width="6" opacity="0.85" stroke-dasharray="1200 195" transform="rotate(202 395 500)"/><circle cx="395" cy="500" r="203" fill="none" stroke="#2ee0d0" stroke-width="3" opacity="0.6" stroke-dasharray="1097 179" transform="rotate(333 395 500)"/></g>
    <g style="mix-blend-mode:screen"><circle cx="605" cy="500" r="209" fill="none" stroke="#ff4f9a" stroke-width="9" opacity="0.95" stroke-dasharray="1129 184" transform="rotate(24 605 500)"/><circle cx="605" cy="500" r="215" fill="none" stroke="#ff4f9a" stroke-width="20" opacity="0.45" stroke-dasharray="1162 189" transform="rotate(37 605 500)"/><circle cx="605" cy="500" r="222" fill="none" stroke="#ff4f9a" stroke-width="6" opacity="0.85" stroke-dasharray="1200 195" transform="rotate(274 605 500)"/><circle cx="605" cy="500" r="203" fill="none" stroke="#ff4f9a" stroke-width="3" opacity="0.6" stroke-dasharray="1097 179" transform="rotate(48 605 500)"/></g>
    <circle cx="215" cy="330" r="9" fill="#2ee0d0" opacity=".85"/><circle cx="190" cy="365" r="5" fill="#2ee0d0" opacity=".85"/><circle cx="800" cy="690" r="11" fill="#ff4f9a" opacity=".85"/><circle cx="830" cy="655" r="6" fill="#ff4f9a" opacity=".85"/><circle cx="845" cy="700" r="4" fill="#ff4f9a" opacity=".85"/>
  </svg>
</div>

<!-- O · A coffee bean whose crease is a rising chart -->
<div class="tile" id="o"><span class="label">O · MARKET BEAN</span>
  <svg viewBox="0 0 1000 1000" width="620" height="620">
    <defs><clipPath id="beanc"><ellipse rx="215" ry="330" transform="translate(500 500) rotate(38)"/></clipPath></defs>
    <ellipse rx="215" ry="330" transform="translate(500 500) rotate(38)" fill="url(#g)"/>
    <g clip-path="url(#beanc)"><polyline points="250,780 400,580 470,630 550,470 610,510 690,330" fill="none" stroke="#0a1520" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M630 322 L700 318 L698 388" fill="none" stroke="#0a1520" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/></g>
  </svg>
</div>
